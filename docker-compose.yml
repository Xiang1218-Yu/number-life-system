services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digital_life
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - digital-life-data:/var/lib/postgresql/data
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
volumes:
  digital-life-data:
